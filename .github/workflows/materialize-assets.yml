name: Materialize staged project assets

on:
  push:
    branches: [main]
    paths:
      - '.staging/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild assets from staged base64 archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .staging ]; then
            echo "No staging directory; nothing to do."
            exit 0
          fi
          cat .staging/github_assets.b64.part* > /tmp/github_assets.b64
          base64 -d /tmp/github_assets.b64 > /tmp/github_assets.tar.xz
          mkdir -p /tmp/materialized
          tar -xJf /tmp/github_assets.tar.xz -C /tmp/materialized
          cp -a /tmp/materialized/. ./
          rm -rf .staging

      - name: Commit materialized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "3DPrintRack asset materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes."
            exit 0
          fi
          git commit -m "Materialize final CAD, STL, coupon, drawing and validation assets"
          git push
